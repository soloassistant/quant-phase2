name: CI

# 为什么只跑 unittest 不装依赖：测试刻意只覆盖不依赖 pandas 的纯逻辑
# （交易日历 / 参数校验 / 成交价护栏 / 源码级回归）。装 pandas 需要下载
# 20 年行情才能跑真回测，不适合放进每次 push。回测跑不跑在 README 里写清楚。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（不执行 import）
        run: python -m compileall -q .

      - name: 单元测试
        run: python -m unittest discover -s tests -v
